<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="96" cy="96" r="90" fill="#1e40af" stroke="#1e3a8a" stroke-width="2"/>
  
  <!-- Calendar with checkmark -->
  <g transform="translate(45, 45)">
    <!-- Calendar body -->
    <rect x="8" y="12" width="86" height="78" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Calendar header -->
    <rect x="8" y="12" width="86" height="16" rx="4" fill="#3b82f6"/>
    
    <!-- Calendar grid lines -->
    <line x1="8" y1="28" x2="94" y2="28" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="8" y1="40" x2="94" y2="40" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="8" y1="52" x2="94" y2="52" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="8" y1="64" x2="94" y2="64" stroke="#e5e7eb" stroke-width="1"/>
    
    <!-- Checkmark inside circle -->
    <circle cx="50" cy="55" r="18" fill="#10b981" opacity="0.9"/>
    <path d="M42 55 L48 61 L58 49" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Optional: Add small academic cap icon at bottom -->
  <g transform="translate(82, 120)">
    <path d="M12 8 L2 2 L22 2 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="6" y="8" width="12" height="8" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5" rx="1"/>
  </g>
</svg>
